# podoroz.art on hermes-vps, behind the Cloudflare proxy.
# Installed as /etc/nginx/sites-available/podoroz (symlinked into sites-enabled).

# Visitor IP comes from Cloudflare; trust the header only from Cloudflare edges
# (https://www.cloudflare.com/ips/).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

# Anything not addressed to podoroz.art (bare IP, scanners) gets nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name podoroz.art www.podoroz.art;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://podoroz.art$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.podoroz.art;
    ssl_certificate /etc/letsencrypt/live/podoroz.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podoroz.art/privkey.pem;
    return 301 https://podoroz.art$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name podoroz.art;
    ssl_certificate /etc/letsencrypt/live/podoroz.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podoroz.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/podoroz/site;
    index index.html;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /_astro/ {
        expires 1y;
    }
    location ~ ^/(video|posters|audio)/ {
        expires 7d;
    }
    location = /api/contact {
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
